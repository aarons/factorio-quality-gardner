[mod-name]
quality-gardener=Quality Gardener

[mod-description]
quality-gardener=When higher-quality versions of your buildings sit in logistic storage, construction bots steadily swap them in - like a gardener replacing the worst plants with the best cuttings on hand.

[mod-setting-name]
entities-per-tick=Entities per Tick
reserve-per-item=Reserve per Item
order-timeout-minutes=Order Timeout (minutes)
skip-hidden-qualities=Skip hidden qualities
hidden-qualities-sticky=Hidden qualities are sticky

[mod-setting-description]
entities-per-tick=How much work the gardener does each tick: candidates examined, network storage rows read, and orders issued or cancelled all count as one entity each.\nProcessing runs continuously in small slices, so the cost per tick stays small and constant instead of spiking. Lower this if the mod is costing UPS; raise it to chew through big upgrade jobs faster.
reserve-per-item=Keep at least this many items of each item-quality combination in the network, untouched by the gardener.\nUseful to keep a float of spares available for new construction.
order-timeout-minutes=Upgrade orders that haven't completed after this long are cancelled - typically because the supply was taken by players, blueprints, or other demand. If supply is still present when the network is next visited, the order is simply re-issued fresh.\nSet to 0 to never cancel (vanilla behavior: starved orders pend forever and raise missing-material alerts).
skip-hidden-qualities=Never upgrade into hidden qualities (added by mods like Quality++ Shiny).
hidden-qualities-sticky=Buildings at a hidden quality are never upgraded out of it.
