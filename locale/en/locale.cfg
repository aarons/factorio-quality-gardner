[mod-name]
quality-gardener=Quality Gardener

[mod-description]
quality-gardener=When higher-quality versions of your buildings sit in logistic storage, construction bots steadily swap them in - like a gardener replacing the worst plants with the best cuttings on hand.

[mod-setting-name]
scan-interval-seconds=Scan Interval (seconds)
max-orders-per-scan=Max Orders per Scan
reserve-per-item=Reserve per Item
order-timeout-minutes=Order Timeout (minutes)
skip-hidden-qualities=Skip hidden qualities
hidden-qualities-sticky=Hidden qualities are sticky

[mod-setting-description]
scan-interval-seconds=How often logistic networks are scanned for upgrade opportunities.\nEach scan reads network storage contents once per network and issues upgrade orders where higher-quality building items are available.
max-orders-per-scan=Upper limit on upgrade orders issued (plus expired orders cancelled) in a single scan, spreading large jobs over several scans instead of spiking one tick.\nExample: dumping 500 legendary machines into storage schedules their swaps gradually.
reserve-per-item=Keep at least this many items of each item-quality combination in the network, untouched by the gardener.\nUseful to keep a float of spares available for new construction.
order-timeout-minutes=Upgrade orders that haven't completed after this long are cancelled - typically because the supply was taken by players, blueprints, or other demand. If supply is still present at the next scan, the order is simply re-issued fresh.\nSet to 0 to never cancel (vanilla behavior: starved orders pend forever and raise missing-material alerts).
skip-hidden-qualities=Never upgrade into hidden qualities (added by mods like Quality++ Shiny).
hidden-qualities-sticky=Buildings at a hidden quality are never upgraded out of it.
