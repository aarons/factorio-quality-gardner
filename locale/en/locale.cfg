[mod-name]
quality-gardener=Quality Gardener

[mod-description]
quality-gardener=When higher-quality versions of your buildings sit in logistic storage, construction bots steadily swap them in - like a gardener replacing the worst plants with the best cuttings on hand.

[mod-setting-name]
manage-factory=Manage Factory
manage-ghosts=Manage Ghosts
manage-upgrade-requests=Manage Upgrade Requests
manage-space-platforms=Manage Space Platforms
entities-per-tick=Entities per Tick
reserve-per-item=Reserve per Item
round-delay-seconds=Round Delay (seconds)
order-expiry-seconds=Order Expiry (seconds)
space-platform-delivery-wait-seconds=Space Platform Delivery Wait (seconds)

[mod-setting-description]
manage-factory=Upgrade placed buildings and their installed modules when higher-quality versions sit in logistic storage.\nThis is the core gardening behavior: each building or module jumps to the best quality on hand, and the displaced item returns to storage to lift the next one.
manage-ghosts=Retarget a ghost whose requested quality is out of stock to the best quality on hand - even a lower one - so it gets built at all.\nOnce built, it becomes an ordinary upgrade candidate and is raised back up as better stock appears.
manage-upgrade-requests=Retarget your upgrade orders (from the upgrade planner) whose target quality is out of stock to the best stocked quality of the target item - even a lower one - so the swap happens at all.\nOnly the quality is adjusted, never which building you asked for, and your orders are still never cancelled.
manage-space-platforms=Garden space platforms too. A platform has no construction bots - the hub builds and upgrades directly from its own inventory - so the gardener treats each platform as its own network, with the hub inventory as the supply.\nBefore adjusting a ghost or order on a platform, the gardener waits for possible deliveries from the planet or other platforms (see the delivery wait setting). Turn this off to garden planets only.
entities-per-tick=How much work the gardener does per tick.\nProcessing runs continuously in tiny slices, so the cost stays small and steady instead of spiking. Raise this if you want entities to get upgraded more quickly. It can impact UPS if the value gets too high.
reserve-per-item=Keep at least this many items of each item-quality combination in the network, untouched by the gardener.\nUseful to keep a float of spares available for new construction.
round-delay-seconds=How long to rest after every network has been visited before starting the next round.\nThe rest is a pickup window: it gives bots time to collect the ordered items, so the next round sees accurate network contents.
order-expiry-seconds=Cancel the Gardner's upgrade orders that have waited this long without being fulfilled. This can happen if inventory changed unexpectedly after an order was placed. The players upgrade orders are never touched. 0 disables expiry: a placed order will wait forever until supply appears. Leaving this setting above 60 seconds (or higher for big bases) should give bots time to fill orders.
space-platform-delivery-wait-seconds=On a space platform, how long to wait for deliveries from the planet or other platforms before adjusting a ghost, upgrade order, or module request whose quality is not aboard.\nAn item already on its way up is always left alone, and a platform in transit never waits - a destroyed turret is refilled from whatever is on hand rather than leaving a hole in the defenses. 0 adjusts immediately, like on a planet.